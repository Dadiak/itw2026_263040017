<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Text Overflow & Text Shadow </title>
    <style>
        p{
            font-size: 26px;
            white-space: nowrap;
            width: 300px;
            background-color: lightblue;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h1{
            font-size: 100px;
            text-align: center;
            text-shadow: 5px 5px gray;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: lightblue;
            text-decoration-skip-ink: none;
        }

    </style>
</head>
<body>
    <h1>Hello,CSS!</h1>
    <P>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Veniam mollitia quasi esse magnam nam nobis, at error perspiciatis. Dignissimos labore magni ipsa eos odit autem nobis deserunt quod sit quia?</P>
</body>
</html>
