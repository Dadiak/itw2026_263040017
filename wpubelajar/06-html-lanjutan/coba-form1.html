<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Coba elemen-elemen form pada HTML</h1>

    <form>
        <label for="nama">Nama:
            <input type="text" name="nama" placeholder="Masukkan nama" id="nama">
        </label>
        <br>
        <label for="password">Password:
            <input type="password" name="password" placeholder="Masukkan password" id="password">
        </label>

    <label for="email">Email:
            <input type="email" name="email" placeholder="Masukkan email" id="email">
    </label>
    <br>
    <label for="angka">angka:
            <input type="number" name="angka" placeholder="Masukkan angka" id="angka">
    <br>
    <label for="tanggal">Tanggal:
            <input type="date" name="tanggal" id="tanggal">
    </label>

    <br>
    <label for="warna">Warna:
            <input type="color" name="warna" id="warna">
    </label>
    
<br>
        <button type="submit">KIRIM!</button>

    <br>
    </form>
</body>
</html>
