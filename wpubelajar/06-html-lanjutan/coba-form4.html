<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Coba Elemen Form dalam Tabel</h1>

    <form>
        <table cellpadding="4">
            <tr>
                <td align="right">
                    <label for="nama">Nama:

                 </td>
                <td> 
                    <input type="text" name="nama" placeholder="Masukkan nama" id="nama">
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="password">Password:

                    </td>
                <td>
                    <input type="email" name="email" placeholder="Masukkan email" id="email">
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="angka">Angka:
                </td>
                <td>
                    <input type="number" name="angka" placeholder="Masukkan angka" id="angka">
                </td>
            </tr>
            <tr>
                <td align="right">
                     <label for="tanggal">Tanggal:
                </td>
                <td>
                     <input type="date" name="tanggal" id="tanggal">
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="warna"> Pilih Warna: 
                </td>
                <td>
                     <input type="color" name="warna" id="warna">
                </td>
            </tr>
            <tr>
                <td colspan="2" >  
                    <button type="submit">KIRIM!</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
