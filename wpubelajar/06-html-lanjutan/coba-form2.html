<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh input Atribut, checkbox, dan radio</title>
</head>
<body>
    <h1>Contoh input Atribut, checkbox, dan radio</h1>

    <form>
        <label for="nama">Nama:
            <input type="text" name="nama" id="nama" placeholder="Masukkan nama" autocomplete="off" autofocus required>
        </label>
        <br>
        <H3>Hobby</H3>
        <label for="hobby1">
            <input type="checkbox" name="hobby1" id="hobby1" value="olahraga"> Olahraga
        </label>
        <br>
        <label for="hobby2">
            <input type="checkbox" name="hobby2" id="hobby2" value="membaca"> Membaca
        </label>

        <br>
        <h3>Jenis Kelamin</h3>
        <label for="pria">
            <input type="radio" name="jenis Kelamin" id="pria" value="pria" checked>
            Pria
        </label>
        <br>
        <label for="wanita">
            <input type="radio" name="jenis kelamin" id="wanita" value="wanita">
            Wanita
        </label>

        <br>
        <button type="submit">KIRIM!</button>
    </form>
</body>
</html>
